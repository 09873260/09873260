name: Torrent Search and Release Uploader

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Movie search query'
        required: true
        default: 'Matrix'
      result_index:
        description: 'Which result number to download (0 for all, or 1, 2, 3...)'
        required: true
        default: '1'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run torrent automation script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query || 'Matrix' }}
          RESULT_INDEX: ${{ github.event.inputs.result_index || '1' }}
        run: |
          python main.py
