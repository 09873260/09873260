name: Torrent Search and Release Uploader

on:
  schedule:
    - cron: '0 0 * * *' # Runs everyday at midnight (UTC)
  workflow_dispatch:     # Allows you to click a button in GitHub to run it manually
    inputs:
      search_query:
        description: 'Torrent search query'
        required: true
        default: 'Ubuntu'

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run torrent automation script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SEARCH_QUERY: ${{ github.event.inputs.search_query || 'Ubuntu' }}
        run: |
          python main.py
