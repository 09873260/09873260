name: GitManual

on:
  workflow_dispatch:
    inputs:
      rss_url:
        description: "הכנס כתובת RSS של הפודקאסט"
        required: true
        type: string
      episodes_per_run:
        description: "כמה פרקים להוריד"
        required: true
        type: choice
        default: "5"
        options:
          - "5"
          - "10"
          - "15"
          - "20"
          - "30"
          - "40"
          - "100"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Run script
        env:
          RSS_URL: ${{ inputs.rss_url }}
          EPISODES_PER_RUN: ${{ inputs.episodes_per_run }}
        run: python gitmanual.py

      - name: Load Environment Variables from Python
        run: |
          if [ -f env_output.env ]; then
            cat env_output.env >> $GITHUB_ENV
          fi

      - name: Zip podcasts folder dynamically
        run: |
          mkdir -p podcasts_manual
          COUNT=$(find podcasts_manual/ -name "*.mp3" 2>/dev/null | wc -l)
          SAFE_SLUG="${PODCAST_SLUG:-podcast}"
          ZIP_NAME="${SAFE_SLUG}_${COUNT}.zip"
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
          zip -r "$ZIP_NAME" podcasts_manual/

      - name: Upload to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create manual-podcast-releases --title "Manual Podcast Episodes Archive" --notes "Accumulated zip archives of manual podcast episodes." || true
          gh release upload manual-podcast-releases "${{ env.ZIP_NAME }}" --clobber

      - name: Remove large files locally before Git commit
        run: |
          find podcasts_manual/ -type f -size +45M -exec rm -f {} +

      - name: Save state and files to Git
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add gitmanual_seen.json podcasts_manual/
          git diff --cached --quiet || (
            git commit -m "Update manual podcast episodes and state" && 
            for i in {1..3}; do 
              git push && break || sleep 5; 
            done
          )
